<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="registro.css">
    
</head>
<body>
    

    <div class="pai">
    <div class="container">
        <h3>Registro</h3>
    
        <div class="nome">
            <input id="Nome" type="text" placeholder="Nome">
        </div>

        <div class="telefone">
            <input id="telefone" type="text" placeholder="Telefone">
        </div>

        <div class="email">
            <input id="Gmail" type="text" placeholder="Email">
        </div>

        <div class="sobrenome">
            <input type="text" placeholder="Sobrenome">
        </div>

        <div class="endereco">
            <input id="endeeco" placeholder="Endereco" type="text">
        </div>

        <div class="cep">
            <input id="cep" type="text" placeholder="Cep">
        </div>

        <div class="senha">
            <input id="senha" type="password" placeholder="Senha">
        </div>

        <div class="confirm">
            <input id="confirm" type="password" placeholder="Confirmar senha">
        </div>

        <button type="submit" class="botao">Registrar</button>

    </div>
    </div>
</body>
</html>
